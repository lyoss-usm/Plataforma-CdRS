<!doctype html>
<html lang="es" data-theme="light">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<title>Estados Visuales — Guía de Diseño CdRS</title>
		<meta
			name="description"
			content="Galería de estados visuales reutilizables (hover, focus, disabled, loading, error) de la guía de diseño CdRS."
		/>
		<link rel="preconnect" href="https://fonts.googleapis.com" />
		<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
		<link
			href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300..700;1,9..144,300..700&family=Nunito:ital,wght@0,300..900;1,300..900&display=swap"
			rel="stylesheet"
		/>
		<link rel="stylesheet" href="./assets/tokens.css" />
		<script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
		<style type="text/tailwindcss">
			@theme inline {
				--color-primary: var(--token-primary);
				--color-primary-hover: var(--token-primary-hover);
				--color-primary-muted: var(--token-primary-muted);
				--color-secondary: var(--token-secondary);
				--color-secondary-hover: var(--token-secondary-hover);
				--color-secondary-muted: var(--token-secondary-muted);
				--color-accent: var(--token-accent);
				--color-accent-muted: var(--token-accent-muted);
				--color-base: var(--token-base);
				--color-surface: var(--token-surface);
				--color-surface-muted: var(--token-surface-muted);
				--color-ink: var(--token-ink);
				--color-ink-soft: var(--token-ink-soft);
				--color-muted: var(--token-muted);
				--color-line: var(--token-line);
				--color-line-strong: var(--token-line-strong);
				--color-success: var(--token-success);
				--color-warning: var(--token-warning);
				--color-error: var(--token-error);
				--color-info: var(--token-info);
				--font-display: var(--token-font-display);
				--font-body: var(--token-font-body);
				--radius-sm: var(--token-radius-sm);
				--radius-md: var(--token-radius-md);
				--radius-lg: var(--token-radius-lg);
				--radius-xl: var(--token-radius-xl);
				--shadow-soft: var(--token-shadow-soft);
				--shadow-float: var(--token-shadow-float);
				--ease-fluid: var(--token-ease-fluid);
			}
		</style>
