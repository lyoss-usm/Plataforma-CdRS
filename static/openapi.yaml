openapi: 3.1.0

info:
  title: API Plataforma Club de Rol Sansano
  version: 0.1.0
  description:
    API utilizada por el catálogo y las solicitudes web del Club de Rol Sansano.

    Los filtros, las fechas de retiro y las reglas de creación se validan contra los datos persistidos en Supabase.
  license:
    name: MIT
    identifier: MIT

servers:
  - url: /
    description: Servidor actual

tags:
  - name: Catálogo
    description: Consulta pública de juegos
  - name: Solicitudes
    description: Registro público de solicitudes de préstamo

paths:
  /api/catalogo:
    get:
      operationId: obtenerCatalogo
      tags:
        - Catálogo
      summary: Consultar el catálogo
      description: |
        Retorna una página de juegos. Todos los filtros proporcionados se
        combinan mediante AND.

        La búsqueda por nombre es parcial e insensible a mayúsculas y acentos.
      security: []

      parameters:
        - name: nombre
          in: query
          required: false
          description: Texto contenido en el nombre del juego
          schema:
            type: string
            default: ''
          example: catan

        - name: jugadores
          in: query
          required: false
          description: Cantidad de jugadores que debe admitir el juego
          schema:
            type: integer
            minimum: 1
          example: 4

        - name: duracionMin
          in: query
          required: false
          description: Duración mínima inclusiva, en minutos
          schema:
            type: integer
            minimum: 1
          example: 30

        - name: duracionMax
          in: query
          required: false
          description: Duración máxima inclusiva, en minutos
          schema:
            type: integer
            minimum: 1
          example: 120

        - name: disponible
          in: query
          required: false
          description: Filtra según la existencia de un ejemplar en bodega
          schema:
            type: boolean
          example: true

        - name: calificacionMin
          in: query
          required: false
          description: Calificación mínima inclusiva
          schema:
            type: number
            minimum: 0
            maximum: 10
          example: 7

        - name: dificultad
          in: query
          required: false
          description: Dificultad exacta del juego
          schema:
            type: string
            enum:
              - Fácil
              - Intermedio
              - Difícil
          example: Intermedio

        - name: offset
          in: query
          required: false
          description: Cantidad de resultados que deben omitirse
          schema:
            type: integer
            minimum: 0
            default: 0
          example: 0

        - name: limit
          in: query
          required: false
          description: Cantidad máxima de juegos en la página
          schema:
            type: integer
            minimum: 1
            maximum: 50
            default: 10
          example: 10

      responses:
        '200':
          description: Página del catálogo obtenida correctamente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CatalogPage'
              example:
                juegos:
                  - idJuego: 1
                    nombreJuego: Catan
                    tipo: Juego base
                    idJuegoBase: null
                    edadMinima: 10
                    jugadoresMin: 3
                    jugadoresMax: 4
                    duracion: 90
                    calificacion: 7.5
                    dificultad: Intermedio
                    pathImagen: /ludoteca/catan.jpg
                    manual: null
                    video: null
                    disponible: true
                total: 1
                hayMas: false

        '400':
          description: Uno o más parámetros de consulta son inválidos
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationError'
              example:
                message: Los filtros del catálogo no son válidos.
                issues:
                  - code: too_big
                    path:
                      - limit
                    message: 'Too big: expected number to be <=50'

        '500':
          description: No fue posible consultar o validar los datos de Supabase
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                message: No se pudo cargar el catálogo.

  /api/solicitudes/opciones:
    get:
      operationId: obtenerOpcionesSolicitud
      tags:
        - Solicitudes
      summary: Obtener las opciones del formulario de solicitud
      description: |
        Retorna las expansiones del juego base que tienen al menos un
        ejemplar en bodega.
      security: []
      parameters:
        - name: idJuego
          in: query
          required: true
          description: Identificador del juego base seleccionado
          schema:
            type: integer
            minimum: 1
      responses:
        '200':
          description: Opciones obtenidas correctamente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OpcionesSolicitudWeb'
        '400':
          description: El identificador del juego no es válido
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationError'
        '500':
          description: No fue posible obtener las opciones desde Supabase
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/solicitudes:
    post:
      operationId: crearSolicitudWeb
      tags:
        - Solicitudes
      summary: Crear una solicitud de préstamo
      description: |
        Valida los datos personales y registra una solicitud pendiente. El
        servidor traduce el bloque elegido a una fecha vigente y selecciona
        los ejemplares más aptos; sus identificadores no se exponen en la
        respuesta.
      security: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/CrearSolicitudWeb'
      responses:
        '201':
          description: Solicitud registrada correctamente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SolicitudCreada'
        '400':
          description: El formulario o la relación entre juegos no es válida
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/ValidationError'
                  - $ref: '#/components/schemas/SolicitudError'
        '403':
          description: El Sansano tiene una suspensión activa
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SolicitudError'
        '409':
          description: Las opciones cambiaron o los datos ya están en uso
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SolicitudError'
        '500':
          description: No fue posible registrar la solicitud
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

components:
  schemas:
    ExpansionSolicitud:
      type: object
      additionalProperties: false
      required:
        - idJuego
        - nombreJuego
      properties:
        idJuego:
          type: integer
          minimum: 1
        nombreJuego:
          type: string
          minLength: 1

    OpcionesSolicitudWeb:
      type: object
      additionalProperties: false
      required:
        - expansiones
      properties:
        expansiones:
          type: array
          items:
            $ref: '#/components/schemas/ExpansionSolicitud'

    CrearSolicitudWeb:
      type: object
      additionalProperties: false
      required:
        - idJuego
        - nombreSansano
        - rut
        - rol
        - telefono
        - correoInstitucional
        - bloqueRetiro
        - aceptaTerminos
      properties:
        idJuego:
          type: integer
          minimum: 1
        idJuegoExpansion:
          type:
            - integer
            - 'null'
          minimum: 1
        nombreSansano:
          type: string
          minLength: 1
          maxLength: 120
        rut:
          type: string
          description: RUT con dígito verificador; el guion es opcional
          example: 18585543-0
        rol:
          type: string
          description: ROL con el mismo dígito verificador del RUT
          example: 202610101-0
        telefono:
          type: string
          pattern: '^\d{8}$'
          description: Ocho dígitos posteriores al prefijo +569
        correoInstitucional:
          type: string
          format: email
        bloqueRetiro:
          type: string
          enum:
            - martes
            - jueves
          description: Día elegido; el servidor lo traduce a la próxima fecha permitida
        aceptaTerminos:
          type: string
          enum:
            - 'on'
          description: Valor enviado por el checkbox HTML al estar marcado

    SolicitudCreada:
      type: object
      additionalProperties: false
      required:
        - idSolicitud
      properties:
        idSolicitud:
          type: integer
          minimum: 1

    SolicitudError:
      type: object
      additionalProperties: false
      required:
        - message
      properties:
        message:
          type: string
        field:
          type: string
          description: Campo relacionado con el error, cuando corresponde

    CatalogGame:
      type: object
      additionalProperties: false
      required:
        - idJuego
        - nombreJuego
        - tipo
        - idJuegoBase
        - edadMinima
        - jugadoresMin
        - jugadoresMax
        - duracion
        - calificacion
        - dificultad
        - pathImagen
        - manual
        - video
        - disponible
      properties:
        idJuego:
          type: integer
          minimum: 1
          description: Identificador único del juego

        nombreJuego:
          type: string
          minLength: 1
          description: Nombre del juego

        tipo:
          type: string
          enum:
            - Juego base
            - Expansión
          description: Clasificación del registro

        idJuegoBase:
          type:
            - integer
            - 'null'
          minimum: 1
          description: |
            Identificador del juego base asociado. Es null cuando tipo es
            Juego base.

        edadMinima:
          type:
            - integer
            - 'null'
          minimum: 1
          description: Edad mínima recomendada

        jugadoresMin:
          type:
            - integer
            - 'null'
          minimum: 1
          description: Cantidad mínima de jugadores

        jugadoresMax:
          type:
            - integer
            - 'null'
          minimum: 1
          description: Cantidad máxima de jugadores

        duracion:
          type:
            - integer
            - 'null'
          minimum: 1
          description: Duración estimada en minutos

        calificacion:
          type:
            - number
            - 'null'
          minimum: 0
          maximum: 10
          description: Calificación del juego

        dificultad:
          type:
            - string
            - 'null'
          enum:
            - Fácil
            - Intermedio
            - Difícil
            - null
          description: Dificultad del juego

        pathImagen:
          type:
            - string
            - 'null'
          description: Ruta persistida de la imagen

        manual:
          type:
            - string
            - 'null'
          format: uri
          description: URL del manual

        video:
          type:
            - string
            - 'null'
          format: uri
          description: URL del video tutorial

        disponible:
          type: boolean
          description: |
            Es true cuando existe al menos un Ejemplar en estado En bodega.

    CatalogPage:
      type: object
      additionalProperties: false
      required:
        - juegos
        - total
        - hayMas
      properties:
        juegos:
          type: array
          items:
            $ref: '#/components/schemas/CatalogGame'

        total:
          type: integer
          format: int64
          minimum: 0
          description: Cantidad total de juegos que cumplen los filtros

        hayMas:
          type: boolean
          description: Indica si existe una página posterior

    ValidationIssue:
      type: object
      required:
        - code
        - path
        - message
      properties:
        code:
          type: string
          description: Código de validación de Zod

        path:
          type: array
          description: Ruta del parámetro inválido
          items:
            oneOf:
              - type: string
              - type: integer

        message:
          type: string
          description: Descripción de la validación fallida
      additionalProperties: true

    ValidationError:
      type: object
      additionalProperties: false
      required:
        - message
        - issues
      properties:
        message:
          type: string
        issues:
          type: array
          items:
            $ref: '#/components/schemas/ValidationIssue'

    ErrorResponse:
      type: object
      additionalProperties: false
      required:
        - message
      properties:
        message:
          type: string
