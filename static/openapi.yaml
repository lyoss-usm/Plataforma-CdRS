openapi: 3.1.0

info:
  title: API Plataforma Club de Rol Sansano
  version: 0.1.0
  description:
    API utilizada por el catálogo y las solicitudes web del Club de Rol Sansano.

    Los filtros, las fechas de retiro y las reglas de creación se validan contra los datos persistidos en Supabase.
  license:
    name: MIT
    identifier: MIT

servers:
  - url: /
    description: Servidor actual

tags:
  - name: Catálogo
    description: Consulta pública de juegos
  - name: Préstamos
    description: Cajero de juntas (staff con permiso prestamos:junta)
  - name: Exportación
    description: Exportación de datos a CSV (solo Directivo)
  - name: Solicitudes
    description: Registro público de solicitudes de préstamo
  - name: BGG
    description: Proxy de BoardGameGeek con caché (staff con permiso inventario:editar)

paths:
  /api/catalogo:
    get:
      operationId: obtenerCatalogo
      tags:
        - Catálogo
      summary: Consultar el catálogo
      description: |
        Retorna una página de juegos. Todos los filtros proporcionados se
        combinan mediante AND.

        La búsqueda por nombre es parcial e insensible a mayúsculas y acentos.
      security: []

      parameters:
        - name: nombre
          in: query
          required: false
          description: Texto contenido en el nombre del juego
          schema:
            type: string
            default: ''
          example: catan

        - name: jugadores
          in: query
          required: false
          description: Cantidad de jugadores que debe admitir el juego
          schema:
            type: integer
            minimum: 1
          example: 4

        - name: duracionMin
          in: query
          required: false
          description: Duración mínima inclusiva, en minutos
          schema:
            type: integer
            minimum: 1
          example: 30

        - name: duracionMax
          in: query
          required: false
          description: Duración máxima inclusiva, en minutos
          schema:
            type: integer
            minimum: 1
          example: 120

        - name: disponible
          in: query
          required: false
          description: Filtra según la existencia de un ejemplar en bodega
          schema:
            type: boolean
          example: true

        - name: calificacionMin
          in: query
          required: false
          description: Calificación mínima inclusiva
          schema:
            type: number
            minimum: 0
            maximum: 10
          example: 7

        - name: dificultad
          in: query
          required: false
          description: Dificultad exacta del juego
          schema:
            type: string
            enum:
              - Fácil
              - Intermedio
              - Difícil
          example: Intermedio

        - name: offset
          in: query
          required: false
          description: Cantidad de resultados que deben omitirse
          schema:
            type: integer
            minimum: 0
            default: 0
          example: 0

        - name: limit
          in: query
          required: false
          description: Cantidad máxima de juegos en la página
          schema:
            type: integer
            minimum: 1
            maximum: 50
            default: 10
          example: 10

      responses:
        '200':
          description: Página del catálogo obtenida correctamente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CatalogPage'
              example:
                juegos:
                  - idJuego: 1
                    nombreJuego: Catan
                    tipo: Juego base
                    idJuegoBase: null
                    edadMinima: 10
                    jugadoresMin: 3
                    jugadoresMax: 4
                    duracion: 90
                    calificacion: 7.5
                    dificultad: Intermedio
                    pathImagen: /ludoteca/catan.jpg
                    manual: null
                    video: null
                    disponible: true
                total: 1
                hayMas: false

        '400':
          description: Uno o más parámetros de consulta son inválidos
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationError'
              example:
                message: Los filtros del catálogo no son válidos.
                issues:
                  - code: too_big
                    path:
                      - limit
                    message: 'Too big: expected number to be <=50'

        '500':
          description: No fue posible consultar o validar los datos de Supabase
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                message: No se pudo cargar el catálogo.

  /admin/prestamos:
    post:
      operationId: crearPrestamoJunta
      tags:
        - Préstamos
      summary: Registrar un préstamo de junta
      description: |
        Crea en una transacción la Solicitud Aprobada, el Prestamo Activo y deja el
        ejemplar Prestado (RPC crear_prestamo_junta). El staff prestador se toma de la
        sesión. Rechaza ejemplares que no estén En bodega y sansanos suspendidos.
      security:
        - sesionSupabase: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PrestamoJuntaRequest'
            example:
              idEjemplar: SEED-BASE-000001
              rutSansano: 20111222
              tipoDocumento: TNE
      responses:
        '201':
          description: Préstamo creado
          content:
            application/json:
              schema:
                type: object
                required:
                  - success
                  - idPrestamo
                properties:
                  success:
                    type: boolean
                  idPrestamo:
                    type: integer
                    minimum: 1
              example:
                success: true
                idPrestamo: 42
        '400':
          $ref: '#/components/responses/PrestamoInvalido'
        '401':
          $ref: '#/components/responses/PrestamoNoAutenticado'
        '403':
          $ref: '#/components/responses/PrestamoSinPermiso'
        '404':
          description: El ejemplar o el sansano no existe
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PrestamoError'
              example:
                error: El ejemplar CAT-999 no existe
        '409':
          description: El ejemplar no está en bodega o el sansano tiene una suspensión activa
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PrestamoError'
              example:
                error: 'El ejemplar CAT-001 no está en bodega (estado: Prestado)'
        '500':
          $ref: '#/components/responses/PrestamoErrorInterno'

    patch:
      operationId: devolverPrestamo
      tags:
        - Préstamos
      summary: Registrar la devolución de un préstamo
      description: |
        Cierra un Prestamo Activo como Devuelto y deja el ejemplar En bodega o Para
        revisar (RPC devolver_prestamo). El staff receptor se toma de la sesión.
      security:
        - sesionSupabase: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DevolucionRequest'
            example:
              idPrestamo: 42
              estadoFinal: Para revisar
      responses:
        '200':
          description: Devolución registrada
          content:
            application/json:
              schema:
                type: object
                required:
                  - success
                properties:
                  success:
                    type: boolean
              example:
                success: true
        '400':
          $ref: '#/components/responses/PrestamoInvalido'
        '401':
          $ref: '#/components/responses/PrestamoNoAutenticado'
        '403':
          $ref: '#/components/responses/PrestamoSinPermiso'
        '409':
          description: El préstamo no existe o ya fue devuelto
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PrestamoError'
              example:
                error: El préstamo 42 no existe o ya fue devuelto
        '500':
          $ref: '#/components/responses/PrestamoErrorInterno'

  /admin/prestamos/ejemplares/{idEjemplar}:
    get:
      operationId: buscarEjemplarCajero
      tags:
        - Préstamos
      summary: Ficha de un ejemplar para el mesón
      description: |
        Devuelve el ejemplar, su juego y el préstamo Activo si lo tiene. Requiere
        prestamos:junta. El código se normaliza a mayúsculas.
      security:
        - sesionSupabase: []
      parameters:
        - name: idEjemplar
          in: path
          required: true
          schema:
            type: string
          example: SEED-BASE-000001
      responses:
        '200':
          description: Ejemplar encontrado
          content:
            application/json:
              schema:
                type: object
                required:
                  - ficha
                  - prestamoActivo
                properties:
                  ficha:
                    type: object
                    description: '{ ejemplar, juego }'
                  prestamoActivo:
                    $ref: '#/components/schemas/PrestamoEnCurso'
        '401':
          $ref: '#/components/responses/PrestamoNoAutenticado'
        '403':
          $ref: '#/components/responses/PrestamoSinPermiso'
        '404':
          description: El ejemplar no existe
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PrestamoError'
        '500':
          $ref: '#/components/responses/PrestamoErrorInterno'

  /admin/prestamos/sansanos/{rut}:
    get:
      operationId: buscarSolicitanteCajero
      tags:
        - Préstamos
      summary: Solicitante por RUT
      description: |
        Devuelve el sansano, su suspensión vigente (o null) y su préstamo Activo (o null).
        Requiere prestamos:junta.
      security:
        - sesionSupabase: []
      parameters:
        - name: rut
          in: path
          required: true
          description: RUT sin dígito verificador
          schema:
            type: integer
            minimum: 1
          example: 60000001
      responses:
        '200':
          description: Sansano encontrado
          content:
            application/json:
              schema:
                type: object
                required:
                  - sansano
                  - suspension
                  - prestamoActivo
                properties:
                  sansano:
                    type: object
                  suspension:
                    type:
                      - object
                      - 'null'
                  prestamoActivo:
                    $ref: '#/components/schemas/PrestamoEnCurso'
        '400':
          description: RUT inválido
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PrestamoError'
        '401':
          $ref: '#/components/responses/PrestamoNoAutenticado'
        '403':
          $ref: '#/components/responses/PrestamoSinPermiso'
        '404':
          description: El RUT no está registrado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PrestamoError'
        '500':
          $ref: '#/components/responses/PrestamoErrorInterno'

  /admin/prestamos/sansanos:
    post:
      operationId: altaSansanoCajero
      tags:
        - Préstamos
      summary: Alta rápida de un sansano desde el mesón
      description: |
        Crea un sansano común (sin cargo ni cuenta). Requiere prestamos:junta; la RLS
        sansano_insert_staff lo permite a todo el staff.
      security:
        - sesionSupabase: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required:
                - rutSansano
                - digitoVerificador
                - rolSansano
                - nombreSansano
                - telefono
                - correoInstitucional
              properties:
                rutSansano:
                  type: integer
                  minimum: 1
                digitoVerificador:
                  type: integer
                  minimum: 0
                  maximum: 10
                  description: 10 representa K
                rolSansano:
                  type: integer
                  minimum: 1
                nombreSansano:
                  type: string
                  minLength: 1
                telefono:
                  type: integer
                  minimum: 10000000
                  maximum: 99999999
                  description: Ocho dígitos posteriores al prefijo +56 9
                correoInstitucional:
                  type: string
                  format: email
                  description: Dominio institucional USM
            example:
              rutSansano: 21333444
              digitoVerificador: 5
              rolSansano: 202412345
              nombreSansano: Ana Pérez
              telefono: 12345678
              correoInstitucional: ana.perez@usm.cl
      responses:
        '201':
          description: Sansano creado
          content:
            application/json:
              schema:
                type: object
                required:
                  - sansano
                properties:
                  sansano:
                    type: object
        '400':
          $ref: '#/components/responses/PrestamoInvalido'
        '401':
          $ref: '#/components/responses/PrestamoNoAutenticado'
        '403':
          $ref: '#/components/responses/PrestamoSinPermiso'
        '409':
          description: RUT, rol, teléfono o correo ya registrado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PrestamoError'
              example:
                error: Ya existe un sansano con ese RUT.
        '500':
          $ref: '#/components/responses/PrestamoErrorInterno'

  /admin/exportar:
    get:
      operationId: exportarDatos
      tags:
        - Exportación
      summary: Exportar datasets a CSV o ZIP
      description: |
        Solo lectura. Un dataset devuelve un `.csv` (UTF-8 sin BOM, encabezado snake_case, fechas
        ISO-8601); varios devuelven un `.zip` con un CSV por dataset. Solo el rol Directivo; la
        lectura usa la sesión del usuario, por lo que la RLS sigue siendo la autoridad.
      security:
        - sesionSupabase: []
      parameters:
        - name: dataset
          in: query
          required: true
          description: Repetible para exportar varios datasets
          schema:
            type: array
            minItems: 1
            items:
              type: string
              enum:
                - prestamos
                - solicitudes
                - inventario
                - nomina
          style: form
          explode: true
      responses:
        '200':
          description: Archivo generado
          content:
            text/csv:
              schema:
                type: string
            application/zip:
              schema:
                type: string
                format: binary
        '400':
          description: Dataset inválido o ausente
        '403':
          description: Solo el Directivo puede exportar datos
        '500':
          description: No se pudo generar la exportación

  /api/solicitudes/opciones:
    get:
      operationId: obtenerOpcionesSolicitud
      tags:
        - Solicitudes
      summary: Obtener las opciones del formulario de solicitud
      description: |
        Retorna las expansiones del juego base que tienen al menos un
        ejemplar en bodega.
      security: []
      parameters:
        - name: idJuego
          in: query
          required: true
          description: Identificador del juego base seleccionado
          schema:
            type: integer
            minimum: 1
      responses:
        '200':
          description: Opciones obtenidas correctamente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OpcionesSolicitudWeb'
        '400':
          description: El identificador del juego no es válido
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationError'
        '500':
          description: No fue posible obtener las opciones desde Supabase
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/solicitudes:
    post:
      operationId: crearSolicitudWeb
      tags:
        - Solicitudes
      summary: Crear una solicitud de préstamo
      description: |
        Valida los datos personales y registra una solicitud pendiente. El
        servidor traduce el bloque elegido a una fecha vigente y selecciona
        los ejemplares más aptos; sus identificadores no se exponen en la
        respuesta.
      security: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/CrearSolicitudWeb'
      responses:
        '201':
          description: Solicitud registrada correctamente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SolicitudCreada'
        '400':
          description: El formulario o la relación entre juegos no es válida
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/ValidationError'
                  - $ref: '#/components/schemas/SolicitudError'
        '403':
          description: El Sansano tiene una suspensión activa
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SolicitudError'
        '409':
          description: Las opciones cambiaron o los datos ya están en uso
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SolicitudError'
        '500':
          description: No fue posible registrar la solicitud
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /admin/bgg/search:
    get:
      operationId: buscarJuegosBgg
      tags:
        - BGG
      summary: Buscar juegos para el auto-completado
      description: |
        Con `fuente=local` (por defecto) busca primero en `Juego` enlazados a BGG y en la caché; si no
        hay resultados sigue automáticamente a BGG, y si BGG falla responde `origen: local-sin-bgg` con
        la lista vacía. Con `fuente=bgg` omite la base local y consulta BGG directo. La búsqueda de
        BGG solo entrega id, nombre y año.
      security:
        - sesionSupabase: []
      parameters:
        - name: q
          in: query
          required: true
          description: Texto a buscar (largo mínimo en `src/lib/data/bgg.json`)
          schema:
            type: string
            minLength: 2
        - name: fuente
          in: query
          schema:
            type: string
            enum:
              - local
              - bgg
            default: local
        - name: exacta
          in: query
          description: Con `1`, BGG busca el nombre exacto (`exact=1`)
          schema:
            type: string
            enum:
              - '1'
      responses:
        '200':
          description: Resultados y de dónde salieron
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BggBusquedaRespuesta'
        '400':
          description: Consulta demasiado corta o fuente inválida
        '401':
          description: La sesión no corresponde a un staff (sin sesión, `/admin` redirige con 303 al login)
        '403':
          description: El cargo no tiene inventario:editar
        '429':
          $ref: '#/components/responses/BggRateLimit'
        '502':
          description: BGG no disponible o con una respuesta inesperada (solo con `fuente=bgg`)
        '503':
          description: Proxy BGG no configurado (falta BGG_API_TOKEN)
        '504':
          description: BGG no respondió a tiempo (solo con `fuente=bgg`)

  /admin/bgg/{idBgg}:
    get:
      operationId: obtenerFichaBgg
      tags:
        - BGG
      summary: Ficha de un juego de BGG (con caché)
      description: |
        Devuelve la caché, que no expira. Si no hay caché, o con `refrescar=1`, consulta BGG (≤ 3 s) y
        hace upsert **solo en `JuegoBgg`** (el `Juego` se crea al guardar la ficha). Si BGG falla y hay
        caché responde `origen: cache-desactualizada`. No procesa la imagen: si
        `caratula.estado` es `pendiente`, el cliente llama a `POST /admin/bgg/{idBgg}/caratula`.
      security:
        - sesionSupabase: []
      parameters:
        - $ref: '#/components/parameters/IdBgg'
        - name: refrescar
          in: query
          description: Con `1`, ignora la caché y vuelve a consultar BGG
          schema:
            type: string
            enum:
              - '1'
      responses:
        '200':
          description: Ficha normalizada al dominio
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BggFichaRespuesta'
        '400':
          description: id inválido
        '401':
          description: La sesión no corresponde a un staff (sin sesión, `/admin` redirige con 303 al login)
        '403':
          description: El cargo no tiene inventario:editar
        '404':
          description: El juego no existe en BGG
        '429':
          $ref: '#/components/responses/BggRateLimit'
        '502':
          description: BGG no disponible y sin caché
        '503':
          description: Proxy BGG no configurado (falta BGG_API_TOKEN)
        '504':
          description: BGG no respondió a tiempo y no hay caché

  /admin/bgg/{idBgg}/caratula:
    post:
      operationId: procesarCaratulaBgg
      tags:
        - BGG
      summary: Descargar, procesar y subir la carátula
      description: |
        Descarga la imagen de la ficha cacheada (solo dominios permitidos en `bgg.json`), la reduce y la
        sube a `ludoteca/bgg/{idBgg}.jpg`. Es idempotente: si ya hay carátula la devuelve. Si falla,
        la ficha sigue siendo usable (`pathImagen = null`) y se puede reintentar.
      security:
        - sesionSupabase: []
      parameters:
        - $ref: '#/components/parameters/IdBgg'
      responses:
        '200':
          description: Estado de la carátula
          content:
            application/json:
              schema:
                type: object
                required:
                  - caratula
                properties:
                  caratula:
                    $ref: '#/components/schemas/BggCaratula'
                  bytes:
                    type:
                      - integer
                      - 'null'
                    description: Peso de la imagen subida; null si no hubo que procesar
        '400':
          description: id inválido
        '401':
          description: La sesión no corresponde a un staff (sin sesión, `/admin` redirige con 303 al login)
        '403':
          description: El cargo no tiene inventario:editar
        '404':
          description: La ficha no está en la caché (consulta antes GET /admin/bgg/{idBgg})
        '429':
          $ref: '#/components/responses/BggRateLimit'
        '502':
          description: No se pudo descargar o procesar la imagen
        '504':
          description: La imagen no respondió a tiempo

components:
  securitySchemes:
    sesionSupabase:
      type: apiKey
      in: cookie
      name: sb-127-auth-token
      description: |
        Sesión de Supabase Auth guardada en cookies por @supabase/ssr. El nombre real
        depende del proyecto (sb-<ref>-auth-token). Sin sesión, /admin redirige a /login.

  parameters:
    IdBgg:
      name: idBgg
      in: path
      required: true
      description: Identificador del juego en BoardGameGeek
      schema:
        type: integer
        minimum: 1

  responses:
    BggRateLimit:
      description: BGG limitó las solicitudes (o respondió 503)
      headers:
        Retry-After:
          description: Segundos a esperar antes de reintentar (si BGG lo informó)
          schema:
            type: integer
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/PrestamoError'
    PrestamoInvalido:
      description: El cuerpo no cumple el schema
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/PrestamoValidationError'
          example:
            error: Datos inválidos
            detalles:
              tipoDocumento:
                - 'Invalid option: expected one of "Carnet"|"TNE"|"TUI"|"Otro"'
    PrestamoNoAutenticado:
      description: La sesión no corresponde a un staff
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/PrestamoError'
          example:
            error: No autorizado
    PrestamoSinPermiso:
      description: El cargo no tiene el permiso prestamos:junta
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/PrestamoError'
          example:
            error: Tu cargo no puede registrar préstamos de junta
    PrestamoErrorInterno:
      description: Error inesperado al llamar a la base de datos
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/PrestamoError'
          example:
            error: Error interno del servidor

  schemas:
    BggSugerencia:
      type: object
      required: [idBgg, nombre, anio, tipo, idJuego, enCache]
      properties:
        idBgg:
          type: integer
        nombre:
          type: string
        anio:
          type: [integer, 'null']
        tipo:
          type: [string, 'null']
          enum: [Juego base, Expansión, null]
        idJuego:
          type: [integer, 'null']
          description: Juego del catálogo ya enlazado a este idBgg
        enCache:
          type: boolean
          description: Existe en la caché JuegoBgg

    BggBusquedaRespuesta:
      type: object
      required: [resultados, origen]
      properties:
        resultados:
          type: array
          items:
            $ref: '#/components/schemas/BggSugerencia'
        origen:
          type: string
          enum: [local, bgg, local-sin-bgg]

    BggFicha:
      type: object
      required:
        [idBgg, nombreJuego, tipo, idBggBase, anio, edadMinima, jugadoresMin, jugadoresMax, duracion, calificacion, dificultad, peso, urlImagenBgg]
      properties:
        idBgg:
          type: integer
        nombreJuego:
          type: string
        tipo:
          type: string
          enum: [Juego base, Expansión]
        idBggBase:
          type: [integer, 'null']
          description: Para expansiones, id BGG del juego base
        anio:
          type: [integer, 'null']
        edadMinima:
          type: [integer, 'null']
        jugadoresMin:
          type: [integer, 'null']
        jugadoresMax:
          type: [integer, 'null']
        duracion:
          type: [integer, 'null']
          description: Minutos
        calificacion:
          type: [number, 'null']
          description: Null si tiene menos votos que el mínimo de bgg.json
        dificultad:
          type: [string, 'null']
          enum: [Fácil, Intermedio, Difícil, null]
        peso:
          type: [number, 'null']
          description: Peso crudo de BGG (1-5)
        urlImagenBgg:
          type: [string, 'null']

    BggCaratula:
      type: object
      required: [estado, pathImagen, urlPublica]
      properties:
        estado:
          type: string
          enum: [lista, pendiente, sin-imagen]
        pathImagen:
          type: [string, 'null']
          description: Ruta relativa al bucket `ludoteca`
        urlPublica:
          type: [string, 'null']

    BggFichaRespuesta:
      type: object
      required: [ficha, origen, caratula, idJuego]
      properties:
        ficha:
          $ref: '#/components/schemas/BggFicha'
        origen:
          type: string
          enum: [cache, bgg, cache-desactualizada]
        caratula:
          $ref: '#/components/schemas/BggCaratula'
        idJuego:
          type: [integer, 'null']
          description: Juego del catálogo ya enlazado a este idBgg

    PrestamoJuntaRequest:
      type: object
      additionalProperties: false
      required:
        - idEjemplar
        - rutSansano
        - tipoDocumento
      properties:
        idEjemplar:
          type: string
          minLength: 1
          description: Código del ejemplar (QR o ingreso manual)
        rutSansano:
          type: integer
          minimum: 1
          description: RUT del solicitante sin dígito verificador
        tipoDocumento:
          type: string
          enum:
            - Carnet
            - TNE
            - TUI
            - Otro
          description: Documento que el solicitante deja en el mesón

    DevolucionRequest:
      type: object
      additionalProperties: false
      required:
        - idPrestamo
        - estadoFinal
      properties:
        idPrestamo:
          type: integer
          minimum: 1
        estadoFinal:
          type: string
          enum:
            - En bodega
            - Para revisar
          description: Estado en que queda el ejemplar

    PrestamoEnCurso:
      type:
        - object
        - 'null'
      description: Préstamo Activo con su contexto, o null si no hay
      required:
        - prestamo
        - solicitud
        - ejemplar
        - juego
        - sansano
      properties:
        prestamo:
          type: object
        solicitud:
          type: object
        ejemplar:
          type: object
        juego:
          type: object
        sansano:
          type: object

    PrestamoError:
      type: object
      required:
        - error
      properties:
        error:
          type: string

    PrestamoValidationError:
      type: object
      required:
        - error
        - detalles
      properties:
        error:
          type: string
        detalles:
          type: object
          description: Errores por campo (z.flattenError)
          additionalProperties:
            type: array
            items:
              type: string

    ExpansionSolicitud:
      type: object
      additionalProperties: false
      required:
        - idJuego
        - nombreJuego
      properties:
        idJuego:
          type: integer
          minimum: 1
        nombreJuego:
          type: string
          minLength: 1

    OpcionesSolicitudWeb:
      type: object
      additionalProperties: false
      required:
        - expansiones
      properties:
        expansiones:
          type: array
          items:
            $ref: '#/components/schemas/ExpansionSolicitud'

    CrearSolicitudWeb:
      type: object
      additionalProperties: false
      required:
        - idJuego
        - nombreSansano
        - rut
        - rol
        - telefono
        - correoInstitucional
        - bloqueRetiro
        - aceptaTerminos
      properties:
        idJuego:
          type: integer
          minimum: 1
        idJuegoExpansion:
          type:
            - integer
            - 'null'
          minimum: 1
        nombreSansano:
          type: string
          minLength: 1
          maxLength: 120
        rut:
          type: string
          description: RUT con dígito verificador; el guion es opcional
          example: 18585543-0
        rol:
          type: string
          description: ROL USM de 9 dígitos con su dígito verificador (módulo 11); el guion es opcional
          example: 202610101-0
        telefono:
          type: string
          pattern: '^\d{8}$'
          description: Ocho dígitos posteriores al prefijo +56 9
        correoInstitucional:
          type: string
          format: email
        bloqueRetiro:
          type: string
          enum:
            - martes
            - jueves
          description: Día elegido; el servidor lo traduce a la próxima fecha permitida
        aceptaTerminos:
          type: string
          enum:
            - 'on'
          description: Valor enviado por el checkbox HTML al estar marcado

    SolicitudCreada:
      type: object
      additionalProperties: false
      required:
        - idSolicitud
      properties:
        idSolicitud:
          type: integer
          minimum: 1

    SolicitudError:
      type: object
      additionalProperties: false
      required:
        - message
      properties:
        message:
          type: string
        field:
          type: string
          description: Campo relacionado con el error, cuando corresponde

    CatalogGame:
      type: object
      additionalProperties: false
      required:
        - idJuego
        - nombreJuego
        - tipo
        - idJuegoBase
        - edadMinima
        - jugadoresMin
        - jugadoresMax
        - duracion
        - calificacion
        - dificultad
        - pathImagen
        - manual
        - video
        - disponible
      properties:
        idJuego:
          type: integer
          minimum: 1
          description: Identificador único del juego

        nombreJuego:
          type: string
          minLength: 1
          description: Nombre del juego

        tipo:
          type: string
          enum:
            - Juego base
            - Expansión
          description: Clasificación del registro

        idJuegoBase:
          type:
            - integer
            - 'null'
          minimum: 1
          description: |
            Identificador del juego base asociado. Es null cuando tipo es
            Juego base.

        edadMinima:
          type:
            - integer
            - 'null'
          minimum: 1
          description: Edad mínima recomendada

        jugadoresMin:
          type:
            - integer
            - 'null'
          minimum: 1
          description: Cantidad mínima de jugadores

        jugadoresMax:
          type:
            - integer
            - 'null'
          minimum: 1
          description: Cantidad máxima de jugadores

        duracion:
          type:
            - integer
            - 'null'
          minimum: 1
          description: Duración estimada en minutos

        calificacion:
          type:
            - number
            - 'null'
          minimum: 0
          maximum: 10
          description: Calificación del juego

        dificultad:
          type:
            - string
            - 'null'
          enum:
            - Fácil
            - Intermedio
            - Difícil
            - null
          description: Dificultad del juego

        pathImagen:
          type:
            - string
            - 'null'
          description: Ruta persistida de la imagen

        manual:
          type:
            - string
            - 'null'
          format: uri
          description: URL del manual

        video:
          type:
            - string
            - 'null'
          format: uri
          description: URL del video tutorial

        disponible:
          type: boolean
          description: |
            Es true cuando existe al menos un Ejemplar en estado En bodega.

    CatalogPage:
      type: object
      additionalProperties: false
      required:
        - juegos
        - total
        - hayMas
      properties:
        juegos:
          type: array
          items:
            $ref: '#/components/schemas/CatalogGame'

        total:
          type: integer
          format: int64
          minimum: 0
          description: Cantidad total de juegos que cumplen los filtros

        hayMas:
          type: boolean
          description: Indica si existe una página posterior

    ValidationIssue:
      type: object
      required:
        - code
        - path
        - message
      properties:
        code:
          type: string
          description: Código de validación de Zod

        path:
          type: array
          description: Ruta del parámetro inválido
          items:
            oneOf:
              - type: string
              - type: integer

        message:
          type: string
          description: Descripción de la validación fallida
      additionalProperties: true

    ValidationError:
      type: object
      additionalProperties: false
      required:
        - message
        - issues
      properties:
        message:
          type: string
        issues:
          type: array
          items:
            $ref: '#/components/schemas/ValidationIssue'

    ErrorResponse:
      type: object
      additionalProperties: false
      required:
        - message
      properties:
        message:
          type: string
